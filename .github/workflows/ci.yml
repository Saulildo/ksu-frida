name: CI-Build
on:
  push:
    branches:
      - main
      - voidwalker
  pull_request:
    branches:
      - main
      - voidwalker
  workflow_dispatch:

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
      - uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
        with:
          distribution: temurin
          java-version: 11
          cache: gradle
      - name: Read Module Metadata
        id: module-meta
        run: |
          MODULE_VERSION=$(grep "moduleVersion =" module.gradle | awk -F'"' '{print $2}')
          MODULE_NAME=$(grep "moduleName "    module.gradle | awk -F'"' '{print $2}')
          echo "version=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$MODULE_NAME"       >> "$GITHUB_OUTPUT"
          echo "Building $MODULE_NAME $MODULE_VERSION"
      - name: Build Release
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease
      - name: List Build Outputs
        run: |
          echo "── out/ ──"
          ls -la out/ || true
          echo "── zip listing ──"
          find out -maxdepth 1 -name "*.zip" -print
      - name: Upload Zygisk Module Zip
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ${{ steps.module-meta.outputs.name }}-${{ steps.module-meta.outputs.version }}-zygisk
          path: out/${{ steps.module-meta.outputs.name }}-${{ steps.module-meta.outputs.version }}-release.zip
          if-no-files-found: error
      - name: Upload Unpacked Staging (debug)
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: ${{ steps.module-meta.outputs.name }}-${{ steps.module-meta.outputs.version }}-zygisk-unpacked
          path: out/magisk_module_release
          if-no-files-found: warn
