import org.apache.tools.ant.filters.FixCrLfFilter
import org.apache.tools.ant.filters.ReplaceTokens

import java.nio.file.Files

plugins {
    id "de.undercouch.download" version "5.4.0"
}

apply plugin: 'com.android.library'
apply from: file(rootProject.file('module.gradle'))

dependencies {
    implementation 'dev.rikka.ndk.thirdparty:cxx:1.2.0'
    implementation("io.github.vvb2060.ndk:dobby:1.2")
}

task downloadFrida(type: Download) {
    def downloadArchs = ["arm", "arm64"]
    def magiskArchs = ["arm", "arm64"]

    def sources = downloadArchs.collect{
        arch -> "https://github.com/appknox/knox-frida-patcher/releases/download/${fridaVersion}/frida-gadget-${fridaVersion}-android-${arch}.so.xz".toString()
    }

    def outputs = magiskArchs.collect{
        arch ->  "libgadget-${arch}.so.xz".toString()
    }

    def downloads = [sources, outputs].transpose().collectEntries()

    src downloads.keySet()
    dest "$rootDir/gadget"
    overwrite true
    onlyIfModified true
    quiet true
    eachFile { f ->
        f.name = downloads[f.sourceURL.toString()]
    }
}

android {
    namespace = "zygisk.frida"
    compileSdkVersion rootProject.ext.targetSdkVersion
    ndkVersion '25.2.9519653'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // Be explicit about the ABIs we want in the staging output. Without
        // this, AGP can default to a 64-bit-only filter and the generated
        // module zip is missing armeabi-v7a / x86, which then breaks
        // Zygisk's per-process ABI lookup at install time.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments += "MODULE_VERSION_CODE=$moduleVersionCode"
                arguments += "MODULE_VERSION_NAME=$moduleVersion"
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        ndkBuild {
            path "src/jni/Android.mk"
        }
    }
}

afterEvaluate {
    android.libraryVariants.forEach { variant ->
        def variantCapped = variant.name.capitalize()
        def buildTypeLowered = variant.buildType.name.toLowerCase()

        def zipName = "${moduleName}-${moduleVersion}-${buildTypeLowered}.zip"
        def magiskDir = file("${outDir}/magisk_module_${buildTypeLowered}")

        task("prepareMagiskFiles${variantCapped}", type: Sync) {
            dependsOn("assemble$variantCapped")
            dependsOn downloadFrida
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE

            def templatePath = "$rootDir/template/magisk_module"

            into magiskDir
            from(rootDir) {
                include 'config.json.example'
            }
            from(templatePath) {
                exclude 'module.prop'
                exclude 'customize.sh'
            }
            from(templatePath) {
                include 'module.prop'
                expand([
                        id         : magiskModuleId,
                        name       : moduleName,
                        version    : moduleVersion,
                        versionCode: moduleVersionCode.toString(),
                        author     : moduleAuthor,
                        description: moduleDescription,
                ])
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath) {
                include("customize.sh")
                def tokens = [
                        "MODULE_ID": magiskModuleId,
                ]
                filter(ReplaceTokens.class, tokens: tokens)
                filter(FixCrLfFilter.class, eol: FixCrLfFilter.CrLf.newInstance("lf"))
            }
            from(templatePath + "/webroot") {
                into 'webroot'
            }
            from("$buildDir/intermediates/stripped_native_libs/$variantCapped/out/lib") {
                into 'lib'
            }
            from("$rootDir/gadget") {
                exclude '.gitkeep'
                into 'gadget'
            }
            doLast {
                // Move the per-ABI shared object out of lib/<abi>/ into the
                // canonical Magisk Zygisk layout: zygisk/<abi>.so. Magisk
                // auto-extracts that into $MODPATH/zygisk/ at install time
                // and the Zygisk loader picks the right ABI per process,
                // so customize.sh no longer needs to do any lib placement.
                def libDir = file("$magiskDir/lib")
                def zygiskDir = file("$magiskDir/zygisk")
                zygiskDir.mkdirs()
                if (libDir.exists()) {
                    libDir.listFiles().findAll { it.directory }.each { abiDir ->
                        def src = new File(abiDir, "libzygiskfrida.so")
                        if (src.exists()) {
                            def dst = new File(zygiskDir, "${abiDir.name}.so")
                            Files.move(src.toPath(), dst.toPath())
                        }
                    }
                    libDir.deleteDir()
                }
            }
        }

        task("zip${variantCapped}", type: Zip) {
            dependsOn("prepareMagiskFiles${variantCapped}")
            from magiskDir
            archiveFileName.set(zipName)
            destinationDirectory.set(outDir)
        }

        task("push${variantCapped}", type: Exec) {
            dependsOn("zip${variantCapped}")
            workingDir outDir
            commandLine android.adbExecutable, "push", zipName, "/data/local/tmp/"
        }

        task("flash${variantCapped}", type: Exec) {
            dependsOn("push${variantCapped}")
            commandLine android.adbExecutable, "shell", "su", "-c",
                    "magisk --install-module /data/local/tmp/${zipName}"
        }

        task("flashAndReboot${variantCapped}", type: Exec) {
            dependsOn("flash${variantCapped}")
            commandLine android.adbExecutable, "shell", "reboot"
        }

        variant.assembleProvider.get().finalizedBy("zip${variantCapped}")
    }
}
